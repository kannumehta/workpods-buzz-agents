[defaults]
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
respond_to = "anyone"
permission_mode = "auto"

[pods.workpod]
display_name = "WorkPods Pod"
workpods_tool_profile = "internal-workpod;admin"
mcp_servers = ["workpods"]

[pods.geo-pod]
display_name = "WorkPods GEO Pod"
workpods_tool_profile = "internal-geo;admin"
mcp_servers = ["workpods", "composio", "workpods-semrush-mcp"]

[pods.content-pod]
display_name = "WorkPods Content Pod"
workpods_tool_profile = "internal-content;admin"
mcp_servers = ["workpods", "workpods-semrush-mcp"]

[pods.performance-pod]
display_name = "WorkPods Performance Pod"
workpods_tool_profile = "internal-performance;admin"
mcp_servers = ["workpods", "composio", "workpods-semrush-mcp", "workpods-pagespeed-mcp"]

[pods.lifecycle-pod]
display_name = "WorkPods Lifecycle Pod"
workpods_tool_profile = "internal-lifecycle;admin"
mcp_servers = ["workpods", "composio"]

[pods.marketing-pod]
display_name = "WorkPods Marketing Pod"
workpods_tool_profile = "internal-workpod;internal-content;internal-geo;internal-performance;internal-lifecycle;admin"
mcp_servers = ["workpods", "composio", "workpods-email-management"]

[pods.support-desk-pod]
display_name = "WorkPods Support Desk Pod"
workpods_tool_profile = "support;support-admin;admin"
mcp_servers = ["workpods"]
